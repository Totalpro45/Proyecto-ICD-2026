name: Captura diaria de tasas de cambio (elTOQUE)

on:
  schedule:
    # Ejecución diaria a las 08:00 UTC (03:00 hora de Cuba, UTC-5)
    - cron: "0 8 * * *"
  workflow_dispatch:
    # Permite ejecución manual desde la pestaña Actions de GitHub

jobs:
  capturar-tasas:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permite hacer commit del historial de tasas
    concurrency:
      group: captura-tasas-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar captura de tasas de elTOQUE
        env:
          ELTOQUE_API_TOKEN: ${{ secrets.ELTOQUE_API_TOKEN }}
        run: |
          python -m src.exchange_rates.capturar
          mkdir -p "$RUNNER_TEMP"
          cp data/raw/exchange_rates/historial_tasas.json "$RUNNER_TEMP/historial_tasas.json"

      - name: Verificar si hay cambios para commitear
        id: git-status
        run: |
          if git diff --quiet data/raw/exchange_rates/historial_tasas.json; then
            echo "cambio=0" >> $GITHUB_OUTPUT
          else
            echo "cambio=1" >> $GITHUB_OUTPUT
          fi

      - name: Commit de tasas nuevas
        if: steps.git-status.outputs.cambio == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/exchange_rates/historial_tasas.json
          git commit -m "feat(tasas): agregar cotización diaria de elTOQUE"
          git fetch origin main:refs/remotes/origin/main
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::El directorio de trabajo no está limpio antes del rebase."
            git status --short
            exit 1
          fi
          if git rebase origin/main; then
            echo "Rebase completado correctamente."
          else
            git rebase --abort || true
            echo "::error::El rebase falló. El respaldo está en $RUNNER_TEMP/historial_tasas.json."
            exit 1
          fi

      - name: Push de tasas nuevas
        if: steps.git-status.outputs.cambio == '1' && success()
        run: |
          git push origin main

      - name: Guardar cotizaciones como artefacto si el rebase o el push falló
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: historial-tasas-fallido
          path: ${{ runner.temp }}/historial_tasas.json
          retention-days: 7
